name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ffmpeg is needed by renders and by the audio tests.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The renderer's browser: tests make real previews, snapshots and renders.
      - name: Cache Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chrome for rendering
        run: node sidecar/node_modules/hyperframes/bin/hyperframes.mjs browser ensure

      - name: Tests (app and sidecar)
        run: pnpm test

      - name: Build the app (UI)
        run: pnpm --filter app build

      - name: Build the sidecar bundle
        run: pnpm --filter sidecar build
